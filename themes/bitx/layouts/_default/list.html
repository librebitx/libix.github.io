{{ define "main" }}
<h2 class="section-title">最近文章</h2>

<div class="post-list">
    {{ range .Site.RegularPages.ByDate.Reverse }}
    <article class="post-item">
        <div class="post-meta">
            {{ .Date.Format "2006-01-02" }}
        </div>
        <h3 class="post-title">
            <a href="{{ .Permalink }}">{{ .Title }}</a>
        </h3>
        {{ if .Summary }}
        <p class="post-excerpt">{{ .Summary | plainify | truncate 150 }}</p>
        {{ end }}
    </article>
    {{ end }}
</div>
{{ end }}
