<!DOCTYPE html>
<html lang="zh-CN">

<head>
  {{ partial "head.html" . }}
</head>

<body class="{{ if and .IsPage (not .Params.header_visible) (ne .Type "code") (ne .Type "archives") }}is-article-page{{ end }} {{ if .IsHome }}is-home{{ end }}">
  
  <header>
    <ul class="top-nav">
      <li><a href="/">Home</a></li>
      <li><a href="/archives/">归档</a></li>
      <li><a href="/code/">Code</a></li>

      <li><a href="https://github.com/librebitx" target="_blank" aria-label="GitHub">GitHub</a></li>
      <li>
        <button id="theme-toggle" style="background:none;border:none;color:inherit;text-decoration:underline;cursor:pointer;font-size:inherit;padding:0;">
          <span class="icon-moon">Dark Mode</span>
          <span class="icon-sun">Light Mode</span>
        </button>
      </li>
    </ul>
  </header>



  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <hr />

  <footer>

    <p>&copy; {{ now.Year }} {{ .Site.Params.author }} · Day day up !</p>
  </footer>

  <div class="reading-progress" id="reading-progress"></div>

  <!-- Lightbox for images -->
  <div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-content" id="lightbox-img">
    <div id="lightbox-caption" class="lightbox-caption"></div>
  </div>

  <script src="/js/main.js"></script>
  {{ if or .Params.math .Site.Params.math }}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
    integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
    crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous" onload="renderMathInElement(document.body, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false},
      {left: '\\(', right: '\\)', display: false},
      {left: '\\[', right: '\\]', display: true}
    ]
  });"></script>
  {{ end }}

  {{ if or .Params.mermaid .Site.Params.mermaid }}
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.8.0/dist/mermaid.esm.min.mjs';

    // Auto-transform code blocks
    document.querySelectorAll('pre code.language-mermaid').forEach(block => {
      const parent = block.parentElement;
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = block.textContent;
      parent.replaceWith(div);
    });

    mermaid.initialize({ startOnLoad: true, theme: 'neutral' });
  </script>
  {{ end }}
</body>

</html>
