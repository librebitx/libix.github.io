baseURL = "https://librebitx.github.io/"
languageCode = "zh-CN"
title = "Libix's blog"
theme = "bitx"

[params]
  description = "一个极简的个人博客"
  author = "Libix"
  about_url = ""
  math = true
  mermaid = true

[menu]
  [[menu.main]]
    name = "归档"
    url = "/archives/"
    weight = 1
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 2

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false
    codeFences = false
    guessSyntax = false
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      linkify = true
      typographer = true
      table = true

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[[module.mounts]]
  source = "content"
  target = "content"

[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[[module.mounts]]
  source = "themes"
  target = "themes"

[[module.mounts]]
  source = "archetypes"
  target = "archetypes"

[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "data"
  target = "data"

[[module.mounts]]
  source = "i18n"
  target = "i18n"

# Mount code directory as static to serve raw files
[[module.mounts]]
  source = "content/code"
  target = "static/code"
